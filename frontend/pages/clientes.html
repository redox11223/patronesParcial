<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clientes - SERF</title>
    <link rel="stylesheet" href="../css/styles.css">
</head>
<body>
<nav class="navbar">
    <h1>👥 Gestión de Clientes</h1>
    <ul>
        <li><a href="../index.html">🏠 Inicio</a></li>
        <li><a href="productos.html">📦 Productos</a></li>
        <li><a href="clientes.html">👥 Clientes</a></li>
        <li><a href="ventas.html">💰 Ventas</a></li>
        <li><a href="reportes.html">📄 Reportes</a></li>
    </ul>
</nav>

<main class="container">
    <div class="header-section">
        <h2>Lista de Clientes</h2>
        <div class="button-group">
            <button class="btn" onclick="cargarClientes()">🔄 Actualizar</button>
            <button class="btn btn-success" onclick="mostrarFormularioNuevo()">➕ Nuevo Cliente</button>
        </div>
    </div>

    <!-- Formulario -->
    <div id="formularioCliente" class="form-container" style="display: none;">
        <h3 id="tituloFormulario">Nuevo Cliente</h3>
        <form id="clienteForm" onsubmit="guardarCliente(event)">
            <input type="hidden" id="clienteId">

            <div class="form-group">
                <label>Nombre:</label>
                <input type="text" id="nombre" required>
            </div>

            <div class="form-group">
                <label>Documento:</label>
                <input type="text" id="documento" required>
            </div>

            <div class="form-group">
                <label>Teléfono:</label>
                <input type="tel" id="telefono" required>
            </div>

            <div class="form-group">
                <label>País:</label>
                <input type="text" id="pais" required>
            </div>

            <div class="form-buttons">
                <button type="submit" class="btn btn-success">💾 Guardar</button>
                <button type="button" class="btn btn-secondary" onclick="cancelarFormulario()">❌ Cancelar</button>
            </div>
        </form>
    </div>

    <!-- Tabla -->
    <div id="clientesTable" class="table-container">
        <p class="loading">Cargando clientes...</p>
    </div>
</main>

<script src="../js/api.js"></script>
<script src="../js/clientes.js"></script>
</body>
</html>
